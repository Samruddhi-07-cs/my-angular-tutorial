<section class="detail-shell" *ngIf="!isLoading(); else loadingTpl">
  <ng-container *ngIf="product(); else emptyTpl">
    <div class="detail-card">
      <img [src]="product()?.image || 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=900&q=80'" [alt]="product()?.name" title="{{ product()?.name }}" />
      <div class="detail-content">
        <p class="eyebrow">{{ product()?.category }}</p>
        <h1>{{ product()?.name }}</h1>
        <p class="detail-description">{{ product()?.description }}</p>
        <div class="detail-meta">
          <span>⭐ 4.8 rating</span>
          <strong>${{ product()?.price }}</strong>
        </div>
        <div class="detail-actions">
          <button type="button" class="btn-primary">Buy Now</button>
          <button type="button" class="btn-secondary" (click)="addToCart()">Add to Cart</button>
        </div>
        <a routerLink="/products" class="ghost-link">← Back to products</a>
      </div>
    </div>
  </ng-container>
</section>

<ng-template #loadingTpl>
  <div class="loading-state">Loading product details...</div>
</ng-template>

<ng-template #emptyTpl>
  <div class="loading-state">Product not found.</div>
</ng-template>
