<section class="catalog-shell">
  <div class="catalog-header">
    <div>
      <p class="eyebrow">Curated Collection</p>
      <h1>Discover products tailored for your daily life</h1>
    </div>
    <a routerLink="/" class="ghost-link">Back to Home</a>
  </div>

  <div class="catalog-toolbar">
    <span>Showing {{ productData().length }} products</span>
    <div class="toolbar-actions">
      <button type="button" class="filter-chip">Featured</button>
      <button type="button" class="filter-chip">New Arrivals</button>
      <button type="button" class="filter-chip">Best Sellers</button>
    </div>
  </div>

  <div class="catalog-grid" *ngIf="!isLoading(); else loadingTpl">
    <article class="product-card" *ngFor="let product of productData()">
      <img [src]="product.image || 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=900&q=80'" [alt]="product.name" />
      <div class="product-body">
        <p class="product-category">{{ product.category }}</p>
        <h3>{{ product.name }}</h3>
        <p class="product-description">{{ product.description }}</p>
        <div class="product-footer">
          <strong>${{ product.price }}</strong>
          <a [routerLink]="['/products', product.id]" class="detail-link">View Details</a>
        </div>
      </div>
    </article>
  </div>

  <ng-template #loadingTpl>
    <div class="loading-state">Loading products...</div>
  </ng-template>
</section>
