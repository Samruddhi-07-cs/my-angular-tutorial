<section class="catalog-shell">
  <div class="catalog-header">
    <div>
      <p class="eyebrow">Curated Collection</p>
      <h1>Discover products tailored for your daily life</h1>
    </div>
    <a routerLink="/" class="ghost-link">Back to Home</a>
  </div>

  <div class="catalog-toolbar">
    <label class="search-box" for="product-search">
      <span class="material-icons">search</span>
      <input id="product-search" type="text" placeholder="Search by name or category" [value]="searchTerm()" (input)="searchTerm.set($any($event.target).value); applyFilter()" />
    </label>
    <div class="toolbar-actions">
      <span>Showing {{ filteredProducts().length }} products</span>
      <button type="button" class="filter-chip">Featured</button>
      <button type="button" class="filter-chip">New Arrivals</button>
      <button type="button" class="filter-chip">Best Sellers</button>
    </div>
  </div>

  <div class="catalog-grid" *ngIf="!isLoading(); else loadingTpl">
    <article class="product-card" *ngFor="let product of filteredProducts()">
      <img [src]="product.imageUrl || 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=900&q=80'" [alt]="product.name" title="{{ product.name }}" />
      <div class="product-body">
        <p class="product-category">{{ product.category }}</p>
        <h3>{{ product.name }}</h3>
        <p class="product-description">{{ product.description }}</p>
        <div class="product-footer">
          <strong>${{ product.price }}</strong>
          <div class="product-footer-actions">
            <button type="button" class="detail-link" (click)="addToCart(product)">Add to Cart</button>
            <a [routerLink]="['/products', product.id]" class="detail-link">View Details</a>
          </div>
        </div>
      </div>
    </article>
  </div>

  <div class="empty-state" *ngIf="!isLoading() && !filteredProducts().length">
    No products match your search yet.
  </div>

  <ng-template #loadingTpl>
    <div class="loading-state">Loading products...</div>
  </ng-template>
</section>
